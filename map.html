    <style>
        :root {
            --color-bg: #ffffff;
            --color-sky-blue: #30AFFF;
            --color-cyan-light: #92EEFF;
            --color-mint-pale: #D8FFC5;
            --color-mint-accent: #C4F7CA;
            --color-text-dark: #0f2942;
        }

        body {
            font-family: 'Inter', 'Noto Sans Sinhala', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text-dark);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Glassmorphism & Custom Elevated Panel Styling */
        .glass-panel {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(146, 238, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(48, 175, 255, 0.12);
        }

        .gradient-header-badge {
            background: linear-gradient(135deg, var(--color-mint-pale) 0%, var(--color-mint-accent) 100%);
            color: var(--color-text-dark);
            border: 1px solid rgba(48, 175, 255, 0.3);
        }

        .gradient-btn {
            background: linear-gradient(135deg, #30AFFF 0%, #158bdb 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .gradient-btn:hover {
            box-shadow: 0 6px 20px rgba(48, 175, 255, 0.4);
            transform: translateY(-1px);
        }

        .gradient-theme-pill {
            background: linear-gradient(135deg, #ffffff 0%, var(--color-mint-pale) 100%);
        }

        /* Leaflet Map Styling */
        #map {
            width: 100%;
            height: calc(100vh - 110px);
            background-color: #ffffff;
            z-index: 1;
        }

        /* Custom Marker Pin Animation */
        .custom-div-icon {
            background: transparent;
            border: none;
        }

        .marker-pin {
            width: 34px;
            height: 34px;
            border-radius: 50% 50% 50% 0;
            background: var(--color-sky-blue);
            position: absolute;
            transform: rotate(-45deg);
            left: 50%;
            top: 50%;
            margin: -22px 0 0 -17px;
            box-shadow: 0 6px 16px rgba(48, 175, 255, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2.5px solid #ffffff;
        }

        .marker-pin::after {
            content: '';
            width: 12px;
            height: 12px;
            background: var(--color-mint-accent);
            position: absolute;
            border-radius: 50%;
        }

        .marker-pin i {
            transform: rotate(45deg);
            color: #ffffff;
            font-size: 14px;
            z-index: 2;
        }

        .custom-div-icon:hover .marker-pin {
            transform: rotate(-45deg) scale(1.3);
            background: #0f8ee8;
        }

        /* Pulse Ring Effect */
        .pulse-ring {
            position: absolute;
            width: 50px;
            height: 50px;
            left: -8px;
            top: -8px;
            border-radius: 50%;
            background: rgba(146, 238, 255, 0.6);
            border: 2px solid var(--color-sky-blue);
            animation: pulsate 1.8s ease-out infinite;
        }

        @keyframes pulsate {
            0% { transform: scale(0.2); opacity: 1; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        /* Custom Leaflet Popup Box */
        .leaflet-popup-content-wrapper {
            background: #ffffff;
            border-radius: 16px;
            padding: 4px;
            box-shadow: 0 16px 36px rgba(15, 41, 66, 0.15);
            border: 2px solid var(--color-cyan-light);
        }

        .leaflet-popup-tip {
            background: #ffffff;
            border: 1px solid var(--color-cyan-light);
        }

        /* Custom Modern Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--color-mint-pale);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--color-sky-blue);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #158bdb;
        }

        /* Slide Drawer Animation */
        .drawer-slide {
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Footer Marquee styling */
        .marquee-container {
            background: #836FFF;
            border-top: 2px solid var(--color-sky-blue);
        }
    </style>
</head>

        <!-- Search Bar with Dynamic Suggestions Dropdown -->

        /* Global Map State Variables */
        var map;
        var marker;
        var imageBounds = [[0, 0], [2400, 1800]];
        var fallbackCanvasUrl = '';

        window.onload = function() {
            document.getElementById('total-places-count').innerText = places.length;

            // Generate theme-matching map canvas overlay if external image is missing
            generateFallbackMapImage();

            // Initialize Simple CRS Map for custom pixel coordinate space
            map = L.map('map', {
                crs: L.CRS.Simple,
                minZoom: -1.5,
                maxZoom: 3,
                zoomSnap: 0.25,
                attributionControl: false
            });

            var imageUrl = 'your-map-image.webp';
            var img = new Image();
            img.src = imageUrl;

            img.onload = function () {
                var actualBounds = [[0, 0], [img.height, img.width]];
                L.imageOverlay(imageUrl, actualBounds).addTo(map);
                map.fitBounds(actualBounds);
                map.setMaxBounds(actualBounds);
                imageBounds = actualBounds;
            };

            img.onerror = function() {
                // Fallback to custom stylized canvas using requested color palette
                L.imageOverlay(fallbackCanvasUrl, imageBounds).addTo(map);
                map.fitBounds(imageBounds);
                map.setMaxBounds(imageBounds);
            };

            // Build Theme drawer options
            renderThemesList();
        };

        function generateFallbackMapImage() {
            var canvas = document.createElement('canvas');
            canvas.width = 1800;
            canvas.height = 2400;
            var ctx = canvas.getContext('2d');

            // Pure White Background
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Subtle Grid using Cyan/Mint light lines
            ctx.strokeStyle = '#92EEFF';
            ctx.lineWidth = 1.5;
            for (var x = 0; x < canvas.width; x += 75) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (var y = 0; y < canvas.height; y += 75) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Stylized Island Outline with Mint Palette (#D8FFC5 / #C4F7CA)
            ctx.fillStyle = '#D8FFC5';
            ctx.strokeStyle = '#C4F7CA';
            ctx.lineWidth = 10;
            ctx.beginPath();
            ctx.ellipse(980, 1200, 480, 820, 0, 0, 2 * Math.PI);
            ctx.fill();
            ctx.stroke();

            // Blue River Accents using Electric Blue (#30AFFF)
            ctx.strokeStyle = '#30AFFF';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(980, 1800);
            ctx.quadraticCurveTo(780, 1200, 980, 700);
            ctx.stroke();

            // Base Grid Labeling
            ctx.fillStyle = '#30AFFF';
            ctx.font = 'bold 36px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Sri Lanka Historical Map Base Grid', 980, 1200);

            fallbackCanvasUrl = canvas.toDataURL();
        }

        function pointLocation(place) {
            if (marker) { 
                map.removeLayer(marker); 
            }

            // Custom divIcon with animated pulse ring & pins
            var customIcon = L.divIcon({
                className: 'custom-div-icon',
                html: `
                    <div class="pulse-ring"></div>
                    <div class="marker-pin">
                        <i class="fa-solid fa-location-dot"></i>
                    </div>
                `,
                iconSize: [34, 34],
                iconAnchor: [17, 34],
                popupAnchor: [0, -34]
            });

            marker = L.marker(place.coords, { icon: customIcon }).addTo(map);
            
            var popupContent = `
                <div class="p-2.5 min-w-[210px]">
                    <div class="text-[#0f2942] font-extrabold text-base mb-1">${place.sinhala}</div>
                    <div class="text-xs font-bold text-[#30AFFF] mb-2 flex items-center gap-1">
                        <i class="fa-solid fa-[#30AFFF] fa-font text-[#30AFFF]"></i>
                        <span>${place.english}</span>
                    </div>
                    <div class="flex flex-wrap gap-1 mt-2">
                        ${place.titles.map(t => `<span class="px-2 py-0.5 text-[10px] font-bold bg-[#D8FFC5] text-[#0f2942] rounded-md border border-[#C4F7CA]">${t}</span>`).join('')}
                    </div>
                </div>
            `;

            marker.bindPopup(popupContent, { autoClose: false }).openPopup();

            // Smooth Pan and Zoom
            map.flyTo(place.coords, 0.5, {
                duration: 1.2
            });

            // Mobile auto-close drawer
            if (window.innerWidth < 640) {
                closeThemeDrawer();
            }
        }

        function searchLocation() {
            var input = document.getElementById('location-input').value.trim().toLowerCase();
            if (!input) {
                showToast("Please enter a location name to search");
                return;
            }

            var place = places.find(p => p.english.toLowerCase() === input || p.sinhala.toLowerCase() === input);
            
            if (place) {
                pointLocation(place);
                document.getElementById('suggestions').classList.add('hidden');
            } else {
                var partialMatch = places.find(p => p.english.toLowerCase().includes(input) || p.sinhala.toLowerCase().includes(input));
                if (partialMatch) {
                    pointLocation(partialMatch);
                    document.getElementById('location-input').value = partialMatch.english;
                    document.getElementById('suggestions').classList.add('hidden');
                    showToast(`Showing results for "${partialMatch.english}"`);
                } else {
                    showToast("Location not found in database!");
                }
            }
        }

        function showSuggestions() {
            var input = document.getElementById('location-input').value.toLowerCase().trim();
            var suggestionBox = document.getElementById('suggestions');
            var clearBtn = document.getElementById('clear-btn');

            if (input.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
                suggestionBox.classList.add('hidden');
                return;
            }

            var matches = places.filter(p => p.english.toLowerCase().includes(input) || p.sinhala.toLowerCase().includes(input));

            if (matches.length === 0) {
                suggestionBox.classList.add('hidden');
                return;
            }

            suggestionBox.innerHTML = '';
            matches.slice(0, 8).forEach(place => {
                var div = document.createElement('div');
                div.className = 'px-4 py-2.5 hover:bg-[#D8FFC5]/50 cursor-pointer flex items-center justify-between text-xs transition-colors font-medium';
                div.innerHTML = `
                    <div class="text-[#0f2942]">
                        <span class="font-bold text-[#30AFFF] mr-1.5">${place.sinhala}</span>
                        <span class="text-slate-500 font-normal">(${place.english})</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-[10px] text-[#30AFFF]"></i>
                `;
                div.onclick = function () {
                    document.getElementById('location-input').value = place.english;
                    suggestionBox.classList.add('hidden');
                    pointLocation(place);
                };
                suggestionBox.appendChild(div);
            });

            suggestionBox.classList.remove('hidden');
        }

        function handleKeyUp(event) {
            if (event.key === 'Enter') {
                searchLocation();
            }
        }

        function clearSearch() {
            document.getElementById('location-input').value = '';
            document.getElementById('clear-btn').classList.add('hidden');
            document.getElementById('suggestions').classList.add('hidden');
        }

        function renderThemesList() {
            var titlesBox = document.getElementById('titles-box');
            titlesBox.innerHTML = '';

            let titleCounts = {};
            places.forEach(place => {
                place.titles.forEach(t => {
                    titleCounts[t] = (titleCounts[t] || 0) + 1;
                });
            });

            var uniqueTitles = Object.keys(titleCounts);
            document.getElementById('theme-badge').innerText = uniqueTitles.length;

            uniqueTitles.forEach(title => {
                var card = document.createElement('div');
                card.className = 'p-3.5 bg-gradient-to-r from-white to-[#D8FFC5]/30 hover:to-[#C4F7CA]/60 border-2 border-[#92EEFF] rounded-2xl cursor-pointer flex items-center justify-between transition-all shadow-sm hover:shadow-md group';
                card.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="w-9 h-9 rounded-xl bg-[#D8FFC5] group-hover:bg-[#30AFFF] text-[#30AFFF] group-hover:text-white flex items-center justify-center transition-colors border border-[#C4F7CA]">
                            <i class="fa-solid fa-folder-open text-base"></i>
                        </div>
                        <span class="font-bold text-sm text-[#0f2942]">${title}</span>
                    </div>
                    <span class="px-2.5 py-1 bg-[#30AFFF] text-white rounded-full text-xs font-black shadow-xs">
                        ${titleCounts[title]}
                    </span>
                `;
                card.onclick = function () { 
                    showPlacesByTitle(title); 
                };
                titlesBox.appendChild(card);
            });
        }

        function showPlacesByTitle(title) {
            var titlesBox = document.getElementById('titles-box');
            var placesBox = document.getElementById('places-box');
            var backBtn = document.getElementById('drawer-back-container');
            var drawerTitle = document.getElementById('drawer-title');

            titlesBox.classList.add('hidden');
            placesBox.classList.remove('hidden');
            backBtn.classList.remove('hidden');
            drawerTitle.innerText = title;

            placesBox.innerHTML = '';
            var filteredPlaces = places.filter(place => place.titles.includes(title));

            filteredPlaces.forEach(place => {
                var card = document.createElement('div');
                card.className = 'p-3 bg-white hover:bg-[#D8FFC5]/40 border-2 border-[#92EEFF]/60 hover:border-[#30AFFF] rounded-xl cursor-pointer flex items-center justify-between transition-all group shadow-xs';
                card.innerHTML = `
                    <div>
                        <div class="font-bold text-xs md:text-sm text-[#0f2942] group-hover:text-[#30AFFF] transition-colors">${place.sinhala}</div>
                        <div class="text-xs text-slate-400 group-hover:text-slate-600">${place.english}</div>
                    </div>
                    <div class="w-7 h-7 rounded-full bg-[#D8FFC5] text-[#30AFFF] flex items-center justify-center group-hover:bg-[#30AFFF] group-hover:text-white transition-colors">
                        <i class="fa-solid fa-location-dot text-xs"></i>
                    </div>
                `;
                card.onclick = function () { 
                    pointLocation(place); 
                };
                placesBox.appendChild(card);
            });
        }

        function showThemesList() {
            document.getElementById('titles-box').classList.remove('hidden');
            document.getElementById('places-box').classList.add('hidden');
            document.getElementById('drawer-back-container').classList.add('hidden');
            document.getElementById('drawer-title').innerText = "Select Map Theme";
        }

        function toggleThemeDrawer() {
            var drawer = document.getElementById('theme-drawer');
            var backdrop = document.getElementById('drawer-backdrop');

            if (drawer.classList.contains('translate-x-full')) {
                drawer.classList.remove('translate-x-full');
                backdrop.classList.remove('hidden');
            } else {
                closeThemeDrawer();
            }
        }

        function closeThemeDrawer() {
            document.getElementById('theme-drawer').classList.add('translate-x-full');
            document.getElementById('drawer-backdrop').classList.add('hidden');
        }

        function showToast(message) {
            var toast = document.getElementById('toast-container');
            var toastMsg = document.getElementById('toast-message');

            toastMsg.innerText = message;
            toast.classList.remove('translate-x-full', 'opacity-0');
            toast.classList.add('translate-x-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-x-0', 'opacity-100');
                toast.classList.add('translate-x-full', 'opacity-0');
            }, 3000);
        }

        function resetMapView() {
            if (map && imageBounds) {
                map.flyToBounds(imageBounds, { duration: 1 });
                showToast("Map view reset to default bounds");
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    showToast("Error attempting full-screen mode");
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
